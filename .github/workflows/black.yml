name: Black

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  black:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"

      - name: Install black
        run: pip install black==26.5.1

      - name: Check formatting
        run: black --check --diff .
